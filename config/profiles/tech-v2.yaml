# The monitor: all 154 companies (the 76 semiconductor-pilot companies, 51 in software,
# cybersecurity and data/cloud, and from 2026-11-20 16 in electrical and data-centre
# infrastructure and 11 in materials, added live). Since 2026-11-14 this is the profile every command
# uses when --profile is not given; the name and directories are kept so the
# registry, forward-test logs and site already built carry on.
name: tech-v2
title: Technology, semiconductors, infrastructure and materials
description: Semiconductors, software, cybersecurity, data platforms, and the electrical, data-centre infrastructure and materials companies that connect to them.
universe: config/tech_v2/universe.yaml
pipeline: config/pipeline.yaml   # the research specification, shared and unchanged
monitor: config/tech_v2/monitor.yaml
state: monitor_state-tech-v2
site: site-tech-v2
fixture: tech
# Built like the semiconductor pilot: the first refresh replayed 120 month-ends (10 years) with
# the 127 companies it then had (simulated history, labelled), then runs live. The 27
# companies added on 2026-11-20 (154 in all) are covered from that date until a rebuild
# (docs/OPERATIONS.md). Its themes have
# their own tech- IDs; the semiconductor registry is not copied or changed. (For a
# live expansion that should keep another profile's theme IDs, set
# fork_from: <profile> instead; see docs/TECH_PILOT_V2.md.)
id_prefix: tech
