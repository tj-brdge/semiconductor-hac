# DRAFT theme markers for review. NOT used by the pipeline.
#
# Researched 2026-10-24. Each marker has a date, a source URL, the evidence the
# date rests on, and how the source was checked:
#   opened  - the document itself was read (all are SEC EDGAR filings; three quotes
#             were re-checked against the originals)
#   snippet - only search-result text was available (news sites were unreachable);
#             open the URL and confirm the quote before approving
# `notes` lists alternative dates and doubts. Entries marked WEAK in notes need the
# most attention.
#
# To approve: check each entry, edit dates if you disagree, set `approved: true`.
# Approved markers are then copied into labels/themes.yaml (date + source only),
# which is what the evaluation reads. Nothing here affects any run until then.

themes:
