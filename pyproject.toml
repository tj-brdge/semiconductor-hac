[project]
name = "themegraph"
version = "0.1.0"
description = "Point-in-time multi-layer theme graph: market HAC + temporal text clustering"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "duckdb>=1.0",
    "scipy>=1.12",
    "scikit-learn>=1.4",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
# Claude suggestions in the local review page (`themegraph review`).
review = ["anthropic>=1.0"]

[project.scripts]
themegraph = "themegraph.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/themegraph"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["themegraph"]

[tool.ruff.lint.per-file-ignores]
# The report template embeds HTML/JS whose lines are not Python.
"src/themegraph/report/build.py" = ["E501"]
