# The monitor: all 127 companies (the 76 semiconductor-pilot companies plus software,
# cybersecurity and data/cloud). Since 2026-11-14 this is the profile every command
# uses when --profile is not given; the name and directories are kept so the
# registry, forward-test logs and site already built carry on.
name: tech-v2
title: Technology and semiconductors
description: Semiconductors, software, cybersecurity, data platforms and the adjacent companies that connect them.
universe: config/tech_v2/universe.yaml
pipeline: config/pipeline.yaml   # the research specification, shared and unchanged
monitor: config/tech_v2/monitor.yaml
state: monitor_state-tech-v2
site: site-tech-v2
fixture: tech
# Built like the semiconductor pilot: the first refresh replays 120 month-ends (10 years) with
# all 127 companies (simulated history, labelled), then runs live. Its themes have
# their own tech- IDs; the semiconductor registry is not copied or changed. (For a
# live expansion that should keep another profile's theme IDs, set
# fork_from: <profile> instead; see docs/TECH_PILOT_V2.md.)
id_prefix: tech
