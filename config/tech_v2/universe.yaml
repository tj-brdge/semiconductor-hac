# Technology pilot v2 (docs/TECH_PILOT_V2.md): the semiconductor pilot universe
# (config/universe.yaml, unchanged, all 76 issuers kept with their roles) plus 51
# companies in application software, cybersecurity, and data platforms and cloud
# software. Used by the tech-v2 profile only (config/profiles/tech-v2.yaml).
#
# Identities checked against SEC EDGAR on 2026-10-27 (company_tickers_exchange.json
# and each company's filing index): CIK, registered name, exchange, SIC code and the
# first periodic report. One security per company (one CIK). Price history, ETF
# benchmarks and transcript availability still need checking with FMP before the
# first real run (docs/TECH_PILOT_V2.md, "Before the first real run").
#
# Selection criteria (not returns): primary business in one of the three
# categories; listed on NYSE or Nasdaq today; periodic SEC reports (10-K/10-Q or
# 20-F) since at least 2023-10-27, so the history covers two years of the replay and the
# 12-month minimum before a company counts in growth comparisons; the filer's
# history is the same business. Exclusions and gaps are listed in the doc.
extends: ../universe.yaml

name: Technology pilot v2
description: >-
  Semiconductor and adjacent companies from the semiconductor pilot, plus
  application software, cybersecurity, and data platform and cloud software
  companies. Themes can connect any of them.
version: "2"

# Broad market, technology, and per-sector references (config/tech_v2/monitor.yaml
# decides which are compared with each theme). All must be ingested.
benchmarks: [SPY, XLK, SOXX, IGV, CIBR]

sectors:
  app_software: Application software
  security: Cybersecurity
  data_cloud: Data and cloud software

changes:
  # Built with full history (docs/TECH_PILOT_V2.md, "How the pilot is built"): the
  # 51 companies are covered from the start, like the original 76, so the first
  # refresh replays 120 month-ends (10 years) with all 127 companies (labelled simulated).
  - version: "2"
    date: 2026-10-29
    note: "Technology pilot v2: 51 software, cybersecurity and data/cloud companies, with full history"

