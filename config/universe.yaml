# v1 universe. `role: core` names are used in every layer and in return-based
# evaluation; `role: adjacent` names join the text layer (and market affinity) so
# themes can link outside semiconductors, but are excluded from return baskets.
#
# listed/delisted dates bound point-in-time membership. Dates marked "verify" come
# from memory and must be checked against FMP profile/delisted data at M1.
# cik is only given where the issuer is no longer in SEC company_tickers.json;
# current issuers are resolved automatically.

