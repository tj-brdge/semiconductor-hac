# Pipeline rules. Every value here is part of the frozen specification: changing
# it after `themegraph freeze` creates a new version that is evaluated forward only.

periods:
  start: 2010-01-01
  dev_end: 2021-12-31
  holdout_end: 2026-10-31
  snapshot_frequency: ME      # pandas offset alias: month end

availability:
  # Delay between a source's publication time and when the pipeline may use it.
  price_lag_days: 0           # close is usable from the next session (enforced in market layer)
  transcript_lag_days: 2
  filing_lag_days: 0          # EDGAR acceptance timestamps are exact
  macro_release_lag_months: 2 # CPI reference month M usable from day 1 of M+2

market:
  benchmark: SPY
  sector_benchmark: SOXX
  residualize_against: [SPY, SOXX]
  windows: [63, 126]
  linkage: average
  min_observations_share: 0.9

macro:
  factors: [us2y, us10y, dxy, wti, cpi]
  window_months: 36
  ridge_alpha: 1.0
  min_months: 30

text:
  window_days: 180
  chunk_words: 350
  min_chunk_words: 40
  exact_dup_drop: true
  novelty_max_similarity: 0.95  # drop passages this close to the issuer's own earlier text
  # Passages that are mostly numbers (tables, ~0.8 numeric tokens), or that repeat
  # financial-statement / safe-harbour wording, cluster by phrasing shared across
  # every issuer rather than by subject. Guidance and pricing passages run ~0.15-0.25
  # numeric and are kept (0.15 dropped them).
  max_numeric_share: 0.35
  drop_financial_statements: true
  # Buybacks, debt, tax, accounting standards, governance, generic IP risk: real but
  # not themes; they were the largest clusters in the 2016 development window.
  drop_corporate_housekeeping: true
  # Before clustering, centre each window's vectors within their genre (call remarks,
  # call Q&A, each filing section) so clusters form around subject matter rather than
  # register. remove_top_components > 0 also strips the window's strongest shared
  # directions; off by default because they can be real topics (memory vs analog).
  center_by_genre: true
  remove_top_components: 0
  cluster_distance: 0.60        # cosine distance cut (average linkage) after centring;
                                # calibrate by reading topics: `themegraph topics`
  min_cluster_passages: 4
  min_cluster_issuers: 2
  # A cluster continues a topic from the previous window if they share this share of
  # passages (windows overlap) or their centroids are this similar.
  track_link_overlap: 0.30
  track_link_similarity: 0.80
  track_link_min_similarity: 0.50  # overlap links also need this centroid cosine
  keywords_per_topic: 8
  parallel_jobs: 4              # windows clustered in parallel (~0.5 GB each); -1 = all cores

embedding:
  provider: voyage              # voyage | hashing (hashing is for tests/offline development only)
  # Where Voyage models are served. Keys created at dash.voyageai.com use `voyage`;
  # keys created in the MongoDB Atlas console use `mongodb`.
  endpoint: mongodb
  model: voyage-finance-2
  batch_size: 64
  concurrency: 4                # requests in flight; rate limits are retried with backoff
  dimensions: 1024

candidates:
  # Topic share is smoothed over `growth_step_snapshots` (one quarter of monthly
  # snapshots) so the earnings-calendar cycle does not read as growth. A candidate
  # needs that smoothed share to rise for `min_consecutive_growth_windows` steps in a
  # row and by at least `min_growth_ratio` overall.
  min_consecutive_growth_windows: 2
  growth_step_snapshots: 3
  min_growth_ratio: 1.25
  # Emergence, not recurrence: the grown share must exceed anything the topic reached
  # in this many snapshots before the growth began.
  new_high_lookback_snapshots: 24
  min_issuers: 3
  # Spread: issuers in the topic must rise by this many from the start of growth to
  # the flag. A split-off topic is judged against its parent's earlier share, and no
  # flag is raised until the whole new-high lookback lies after the text warm-up.
  min_issuer_growth: 1
  # Generic topics: skip if more than this share of issuers with text already discussed
  # it when its growth began (applies only with >= 2 x min_issuers issuers with text).
  max_issuer_share: 0.5
  min_exposure: 0.05
  market_alignment_window: 63
  market_alignment_baseline_snapshots: 6

evaluation:
  label_match_min_jaccard: 0.34
  label_match_window_days: 1095  # a flag counts as early if within 3 years before consensus
  # Outcome horizons after a first flag: 1, 2 and 3 years. Long horizons suit
  # multi-year holding; a flag can be scored only once its horizon has elapsed
  # inside the period being evaluated.
  forward_sessions: [252, 504, 756]
  null_draws: 500
  seed: 20261022
  primary_metrics:
    - detection_recall
    - median_lead_days
    - comovement_null_percentile
