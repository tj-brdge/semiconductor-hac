<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Theme Adjudication Desk</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@500&display=swap">
<style>
/* Layout: one work bench. Run tabs and progress on top, candidate queue left, the open candidate right; stacks to one column on phones. */
:root {
  --bg: #f2f3ef; --panel: #ffffff; --sunk: #e8eae4; --ink: #18212b; --muted: #5a6570;
  --line: #d6dad2; --accent: #2c5a86; --accent-ink: #ffffff; --focus: #2c5a86;
  --ok: #2b7a4b; --bad: #b0402e; --warn: #9a640f; --real: #11696e; --noise: #69717c;
  --ok-bg: #e3f1e8; --bad-bg: #f6e3df; --warn-bg: #f5ead6; --real-bg: #dcefef; --noise-bg: #eceef0;
  --f-display: "IBM Plex Serif", Georgia, serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px;
  --r: 6px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #10151a; --panel: #172029; --sunk: #0d1216; --ink: #e5eaee; --muted: #98a4af;
  --line: #29343f; --accent: #82b2e0; --accent-ink: #0c1620; --focus: #82b2e0;
  --ok: #72c495; --bad: #ee8f7d; --warn: #e2b45c; --real: #62c8cd; --noise: #a3abb5;
  --ok-bg: #173226; --bad-bg: #3a1f1a; --warn-bg: #362a14; --real-bg: #12302f; --noise-bg: #222a33;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #10151a; --panel: #172029; --sunk: #0d1216; --ink: #e5eaee; --muted: #98a4af;
  --line: #29343f; --accent: #82b2e0; --accent-ink: #0c1620; --focus: #82b2e0;
  --ok: #72c495; --bad: #ee8f7d; --warn: #e2b45c; --real: #62c8cd; --noise: #a3abb5;
  --ok-bg: #173226; --bad-bg: #3a1f1a; --warn-bg: #362a14; --real-bg: #12302f; --noise-bg: #222a33;
  color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5; }
.wrap { max-width: 1280px; margin: 0 auto; padding-block: var(--s5) var(--s6);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: var(--s4); }
h1 { font-family: var(--f-display); font-weight: 500; font-size: 1.6rem; margin: 0; text-wrap: balance; }
h2 { font-size: 1.05rem; margin: 0; text-wrap: balance; }
.mono { font-family: var(--f-mono); font-size: 0.86em; }
.muted { color: var(--muted); }
.label { font-size: 0.72rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; border: 1px solid var(--line); background: var(--panel); border-radius: var(--r); padding: 6px 12px; }
button:hover:not(:disabled) { border-color: var(--accent); }
button:disabled { opacity: 0.5; cursor: not-allowed; }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 500; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
input[type=text], textarea { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 6px 10px; width: 100%; }
textarea { min-height: 64px; resize: vertical; }

header.top { display: flex; flex-wrap: wrap; gap: var(--s3) var(--s5); align-items: end; justify-content: space-between; }
.intro { max-width: 68ch; margin: var(--s1) 0 0; color: var(--muted); }
.who { display: grid; gap: var(--s1); min-width: 0; width: min(280px, 100%); }

.bar { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: var(--s3) var(--s4);
  display: flex; flex-wrap: wrap; gap: var(--s3) var(--s5); align-items: center; }
.tabs { display: flex; gap: var(--s1); background: var(--sunk); padding: 3px; border-radius: var(--r); }
.tabs button { border: 0; background: transparent; padding: 5px 14px; }
.tabs button[aria-selected="true"] { background: var(--panel); box-shadow: 0 0 0 1px var(--line); font-weight: 600; }
.stats { display: flex; flex-wrap: wrap; gap: var(--s4); font-variant-numeric: tabular-nums; }
.stat b { font-size: 1.05rem; display: block; line-height: 1.2; }
.actions { display: flex; flex-wrap: wrap; gap: var(--s2); margin-left: auto; }
.meter { height: 6px; background: var(--sunk); border-radius: 3px; overflow: hidden; width: 160px; display: flex; }
.meter i { display: block; height: 100%; }

.note { padding: var(--s2) var(--s3); border-radius: var(--r); background: var(--sunk); color: var(--ink); font-size: 0.92rem; }
.note.warn { background: var(--warn-bg); }
.note.bad { background: var(--bad-bg); }

.bench { display: grid; grid-template-columns: minmax(260px, 340px) minmax(0, 1fr); gap: var(--s4); align-items: start; }
@media (max-width: 820px) { .bench { grid-template-columns: minmax(0, 1fr); } }
.queue { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); min-width: 0; }
.queue .filters { display: flex; flex-wrap: wrap; gap: var(--s1); padding: var(--s2); border-bottom: 1px solid var(--line); }
.queue .filters button { padding: 3px 9px; font-size: 0.82rem; }
.queue .filters button[aria-pressed="true"] { background: var(--sunk); border-color: var(--ink); }
.queue ol { list-style: none; margin: 0; padding: 0; max-height: 70vh; overflow-y: auto; }
.queue li button { width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--line); border-radius: 0;
  background: transparent; padding: var(--s2) var(--s3); display: grid; gap: 2px; }
.queue li button[aria-current="true"] { background: var(--sunk); box-shadow: inset 3px 0 0 var(--accent); }
.qrow { display: flex; gap: var(--s2); align-items: baseline; justify-content: space-between; min-width: 0; }
.qkw { color: var(--muted); font-size: 0.82rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.chip { display: inline-block; font-size: 0.72rem; padding: 1px 7px; border-radius: 999px; font-weight: 600; white-space: nowrap;
  background: var(--noise-bg); color: var(--noise); }
.c-confirmed, .c-real_unlabelled_theme { background: var(--ok-bg); color: var(--ok); }
.c-rejected { background: var(--bad-bg); color: var(--bad); }
.c-noise { background: var(--noise-bg); color: var(--noise); }
.c-duplicate { background: var(--warn-bg); color: var(--warn); }
.c-real_unlabelled_theme { background: var(--real-bg); color: var(--real); }
.c-kind { background: transparent; border: 1px solid var(--line); color: var(--muted); }
.c-blind { background: var(--warn-bg); color: var(--warn); }

.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: var(--s4); display: grid; gap: var(--s4); min-width: 0; }
.meta { display: flex; flex-wrap: wrap; gap: var(--s2) var(--s4); align-items: baseline; }
.kws { display: flex; flex-wrap: wrap; gap: var(--s1); }
.kws span { background: var(--sunk); border-radius: 4px; padding: 1px 7px; font-size: 0.86rem; }
.quotes { display: grid; gap: var(--s3); }
blockquote { margin: 0; padding: var(--s2) var(--s3); border-left: 3px solid var(--line); background: var(--bg); border-radius: 0 var(--r) var(--r) 0; max-width: 80ch; }
blockquote .src { display: block; font-family: var(--f-mono); font-size: 0.76rem; color: var(--muted); margin-bottom: 2px; overflow-wrap: anywhere; }
.ai { border: 1px dashed var(--line); border-radius: var(--r); padding: var(--s3); display: grid; gap: var(--s2); }
.ai.hidden-blind { background: var(--warn-bg); border-style: solid; border-color: transparent; }
.decide { display: flex; flex-wrap: wrap; gap: var(--s2); }
.decide button { min-width: 120px; }
.decide button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.empty { padding: var(--s6) var(--s4); text-align: center; color: var(--muted); display: grid; gap: var(--s3); justify-items: center; }
.empty ol { text-align: left; max-width: 60ch; margin: 0; }
.confirmrow { display: flex; flex-wrap: wrap; gap: var(--s2); align-items: center; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.toast { min-height: 1.4em; font-size: 0.9rem; color: var(--muted); }
@media (prefers-reduced-motion: no-preference) { .queue li button { transition: background 0.12s; } }
</style>
</head><body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>Theme Adjudication Desk</h1>
      <p class="intro">Review each candidate from its text alone. Decisions are written straight to the
        run's <span class="mono">adjudication.yaml</span>. Claude's suggestion stays hidden on the blind
        sample until you decide, so the agreement rate measures whether its other decisions can count.</p>
    </div>
    <label class="who" for="reviewer"><span class="label">Your name, recorded as reviewer</span>
      <input id="reviewer" type="text" autocomplete="name" placeholder="e.g. torrence"></label>
  </header>
  <div id="status" class="note" hidden></div>
  <section class="bar" aria-label="Run">
    <div class="tabs" role="tablist" id="tabs"></div>
    <div class="stats" id="stats"></div>
    <div class="actions">
      <button id="runai" class="primary" disabled>Ask Claude</button>
      <button id="stop" hidden>Stop</button>
    </div>
  </section>
  <div id="bulk" class="note warn" hidden></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <section class="bench">
    <nav class="queue" aria-label="Candidates">
      <div class="filters" id="filters">
        <button data-f="todo" aria-pressed="true">To do</button>
        <button data-f="sample" aria-pressed="false">Blind sample</button>
        <button data-f="matched" aria-pressed="false">Theme matches</button>
        <button data-f="done" aria-pressed="false">Decided</button>
        <button data-f="byai" aria-pressed="false">Decided by Claude</button>
        <button data-f="all" aria-pressed="false">All</button>
      </div>
      <ol id="list"></ol>
    </nav>
    <article class="card" id="detail" aria-live="polite"></article>
  </section>
</div>
<script>
(() => {
  const DECISIONS = {
    matched_theme: ["confirmed", "rejected"],
    negative_control_match: ["confirmed", "rejected"],
    unmatched_candidate: ["real_unlabelled_theme", "noise", "duplicate"],
  };
  const WORDS = { confirmed: "Confirmed", rejected: "Rejected", real_unlabelled_theme: "Real theme",
    noise: "Noise", duplicate: "Duplicate", pending: "Pending" };
  const KIND = { matched_theme: "theme match", negative_control_match: "control match", unmatched_candidate: "unmatched" };
  const token = (location.hash.match(/t=([^&]+)/) || [])[1] || "";
  const S = { runs: [], run: null, data: {}, filter: "todo", sel: null, busy: false, stop: false, armed: false };
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const toast = (t) => { $("toast").textContent = t; };
  const status = (t, cls = "") => { const el = $("status"); el.hidden = !t; el.className = "note " + cls; el.textContent = t || ""; };
  try { $("reviewer").value = localStorage.getItem("reviewer") || ""; } catch (_) {}
  $("reviewer").addEventListener("change", () => { try { localStorage.setItem("reviewer", $("reviewer").value.trim()); } catch (_) {} render(); });
  const reviewer = () => $("reviewer").value.trim();

  async function api(path, body) {
    const r = await fetch(path, body ? { method: "POST", headers: { "Content-Type": "application/json", "X-Review-Token": token }, body: JSON.stringify(body) }
      : { headers: { "X-Review-Token": token } });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || ("HTTP " + r.status));
    return j;
  }
  const cur = () => S.data[S.run];
  const entries = () => cur()?.entries || [];
  const blindHidden = (e) => e.in_sample && !e.blind_human_decision;

  function render() {
    $("tabs").innerHTML = S.runs.map((r) => `<button role="tab" data-run="${esc(r)}" aria-selected="${r === S.run}">${esc(r)}</button>`).join("");
    for (const b of $("filters").querySelectorAll("button")) b.setAttribute("aria-pressed", String(b.dataset.f === S.filter));
    const st = cur()?.stats;
    if (st) {
      const pct = (k) => st.n ? 100 * k / st.n : 0;
      $("stats").innerHTML = `
        <div class="stat"><span class="label">Decided</span><b>${st.decided_by_human + st.decided_by_ai} / ${st.n}</b>
          <div class="meter" aria-hidden="true"><i style="width:${pct(st.decided_by_human)}%;background:var(--accent)"></i><i style="width:${pct(st.decided_by_ai)}%;background:var(--real)"></i></div></div>
        <div class="stat"><span class="label">By you · by Claude</span><b>${st.decided_by_human} · ${st.decided_by_ai}</b></div>
        <div class="stat"><span class="label">Blind sample</span><b>${st.sample_done} / ${st.sample_n}</b></div>
        <div class="stat"><span class="label">Agreement</span><b>${st.paired ? `${st.agree} / ${st.paired} (${Math.round(100 * st.agree / st.paired)}%)` : "—"}</b></div>`;
      const avail = cur().suggestions_available;
      $("runai").disabled = S.busy || !avail || !st.need_ai;
      $("runai").textContent = !avail ? "Claude unavailable" : st.need_ai ? `Ask Claude about ${st.need_ai}` : "Claude has suggested all";
    }
    renderBulk(st); renderList(); renderDetail();
  }

  function renderBulk(st) {
    const el = $("bulk");
    if (!st || (!st.acceptable && !(st.sample_n && st.sample_done < st.sample_n))) { el.hidden = true; S.armed = false; return; }
    el.hidden = false;
    if (!st.acceptable) {
      el.innerHTML = `<strong>Accepting Claude's decisions is locked.</strong> Decide all ${st.sample_n} blind-sample entries first
        (${st.sample_done} done), and let Claude suggest for them. Their agreement rate decides whether Claude's other decisions count
        (80% on at least 20 entries).`;
      return;
    }
    const rate = st.paired ? Math.round(100 * st.agree / st.paired) : 0;
    el.innerHTML = `<div class="confirmrow"><span>On the blind sample you and Claude agreed on <strong>${st.agree} of ${st.paired} (${rate}%)</strong>.
      ${st.acceptable} unmatched candidates have a suggestion and no decision. Theme and control matches are never accepted in bulk.
      ${rate < 80 ? "<strong>Below the 80% bar: these would not count in the comparison.</strong>" : ""}</span>
      ${S.armed ? `<button id="bulkyes" class="primary">Record ${st.acceptable} as Claude's decisions</button><button id="bulkno">Cancel</button>`
        : `<button id="bulkgo">Accept Claude's remaining unmatched decisions…</button>`}</div>`;
    $("bulkgo")?.addEventListener("click", () => { S.armed = true; render(); });
    $("bulkno")?.addEventListener("click", () => { S.armed = false; render(); });
    $("bulkyes")?.addEventListener("click", async () => {
      S.armed = false; S.busy = true; render();
      try { const j = await api("/api/accept_ai", { run: S.run }); S.data[S.run] = j; toast(`Recorded ${j.accepted} decisions from Claude.`); }
      catch (e) { toast("Not recorded: " + e.message); }
      S.busy = false; render();
    });
  }

  function chipFor(e) {
    if (e.decision !== "pending") return `<span class="chip c-${e.decision}">${WORDS[e.decision]}${e.decided_by === "ai" ? " · Claude" : ""}</span>`;
    if (blindHidden(e)) return `<span class="chip c-blind">blind</span>`;
    if (e.ai_suggestion) return `<span class="chip c-kind">Claude: ${WORDS[e.ai_suggestion]}</span>`;
    return `<span class="chip">pending</span>`;
  }

  function renderList() {
    const es = entries().filter((e) => ({ todo: e.decision === "pending", sample: e.in_sample,
      matched: e.kind !== "unmatched_candidate", done: e.decision !== "pending",
      byai: e.decided_by === "ai", all: true }[S.filter]));
    if (!es.some((e) => e.id === S.sel)) S.sel = es[0]?.id ?? null;
    $("list").innerHTML = es.length ? es.map((e) => `<li><button data-id="${esc(e.id)}" aria-current="${e.id === S.sel}">
        <span class="qrow"><span class="mono">${esc(e.candidate_id)}</span>${chipFor(e)}</span>
        <span class="qrow"><span class="muted mono">${esc(e.first_flag || "")}</span><span class="chip c-kind">${KIND[e.kind]}${e.theme ? ": " + esc(e.theme) : ""}</span></span>
        <span class="qkw">${esc(e.keywords.slice(0, 6).join(", "))}</span></button></li>`).join("")
      : `<li class="empty">Nothing in this view.</li>`;
  }

  function renderDetail() {
    const d = $("detail");
    const e = entries().find((x) => x.id === S.sel);
    if (!e) { d.innerHTML = `<div class="empty"><h2>${cur() ? "Nothing to review in this view" : "Loading…"}</h2></div>`; return; }
    const hidden = blindHidden(e);
    d.innerHTML = `
      <div class="meta"><h2 class="mono">${esc(e.candidate_id)}</h2><span class="chip c-kind">${KIND[e.kind]}</span>
        ${e.in_sample ? `<span class="chip c-blind">blind sample</span>` : ""}
        <span class="muted">First flag <span class="mono">${esc(e.first_flag || "?")}</span></span></div>
      ${e.theme ? `<p><span class="label">Question</span><br>Is this candidate really the labelled theme <strong class="mono">${esc(e.theme)}</strong>,
        not just the same companies? ${e.kind === "negative_control_match" ? "This label is a negative control: confirming it counts as a false alarm." : ""}</p>`
        : `<p><span class="label">Question</span><br>Is this one coherent business subject (real theme), boilerplate or a mix (noise), or the same subject as an earlier candidate (duplicate)?</p>`}
      <div><span class="label">Issuers</span><div class="mono">${esc(e.issuers.join(", ") || "—")}</div></div>
      <div><span class="label">Keywords as of the flag</span><div class="kws">${e.keywords.map((k) => `<span>${esc(k)}</span>`).join("") || "—"}</div></div>
      <div class="quotes"><span class="label">Quoted passages</span>${e.quotes.map((q) => `<blockquote><span class="src">${esc(q.symbol)} · ${esc(q.date)} · ${esc(q.passage_id)}</span>${esc(q.text)}</blockquote>`).join("") || `<span class="muted">No quotes.</span>`}</div>
      <div class="ai ${hidden ? "hidden-blind" : ""}"><span class="label">Claude's suggestion</span>
        ${hidden ? `<span>Hidden until you decide: this entry is in the blind sample.</span>`
          : e.ai_suggestion ? `<span><span class="chip c-${e.ai_suggestion}">${WORDS[e.ai_suggestion]}</span></span><span>${esc(e.ai_reason)}</span>
              <span class="muted mono">${esc(e.ai_model)} · ${esc(e.ai_prompt_version)}</span>`
          : `<span class="muted">None yet. Use “Ask Claude” above.</span>`}</div>
      <div><span class="label">Your decision</span><div class="decide">
        ${DECISIONS[e.kind].map((o) => `<button data-d="${o}" aria-pressed="${e.decision === o}">${WORDS[o]}</button>`).join("")}
        ${e.decision !== "pending" ? `<button data-d="pending">Clear</button>` : ""}</div></div>
      <label for="notes"><span class="label">Notes (optional; for a duplicate, name the earlier candidate)</span>
        <textarea id="notes">${esc(e.notes)}</textarea></label>
      ${e.decision !== "pending" ? `<p class="muted">Recorded ${e.decided_by === "ai" ? "from Claude's suggestion" : "by " + esc(e.reviewer)} on ${esc(e.reviewed_on)}.</p>` : ""}
      ${!reviewer() ? `<p class="note warn">Enter your name at the top before deciding.</p>` : ""}`;
    d.querySelectorAll(".decide button").forEach((b) => b.addEventListener("click", () => decide(e, b.dataset.d)));
  }

  async function decide(e, decision) {
    if (!reviewer() && decision !== "pending") { toast("Enter your name first."); $("reviewer").focus(); return; }
    try {
      S.data[S.run] = await api("/api/decide", { run: S.run, id: e.id, decision, reviewer: reviewer(), notes: $("notes")?.value.trim() || "" });
      toast(decision === "pending" ? "Cleared." : `Recorded: ${WORDS[decision]}.`);
      const next = entries().find((x) => x.decision === "pending" && x.id !== e.id && (S.filter !== "sample" || x.in_sample));
      const nextAi = entries().find((x) => x.decided_by === "ai" && x.id !== e.id);
      if (S.filter === "byai" && nextAi) S.sel = nextAi.id;
      else if (next && !["done", "all", "byai"].includes(S.filter)) S.sel = next.id;
    } catch (err) { toast("Not saved: " + err.message); }
    render();
  }

  async function runAI() {
    S.busy = true; S.stop = false; $("stop").hidden = false; render();
    try {
      while (!S.stop) {
        toast(`Claude is reading… ${cur().stats.need_ai} left`);
        const j = await api("/api/suggest", { run: S.run });
        S.data[S.run] = j; render();
        if (!j.remaining || !j.done) { toast(j.missing ? `${j.missing} entries got no usable answer; ask again.` : "Claude has suggested a decision for every entry."); break; }
      }
      if (S.stop) toast("Stopped.");
    } catch (e) { toast("Claude could not answer: " + e.message); }
    S.busy = false; $("stop").hidden = true; render();
  }

  $("tabs").addEventListener("click", async (ev) => { const b = ev.target.closest("button[data-run]"); if (b) { S.run = b.dataset.run; S.sel = null; S.armed = false; await load(); } });
  $("filters").addEventListener("click", (ev) => { const b = ev.target.closest("button[data-f]"); if (b) { S.filter = b.dataset.f; S.sel = null; render(); } });
  $("list").addEventListener("click", (ev) => { const b = ev.target.closest("button[data-id]"); if (b) { S.sel = b.dataset.id; render(); } });
  $("runai").addEventListener("click", runAI);
  $("stop").addEventListener("click", () => { S.stop = true; toast("Stopping after this batch…"); });

  async function load() {
    try { S.data[S.run] = await api("/api/run/" + encodeURIComponent(S.run)); status(""); }
    catch (e) { status("Could not read the run: " + e.message, "bad"); }
    render();
  }
  (async () => {
    if (!token) { status("Open the full link printed by `themegraph review` (it carries a session token).", "bad"); return; }
